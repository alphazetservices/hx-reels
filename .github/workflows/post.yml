name: Post scheduled Reel

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; the keeper chain below does the real timing
  workflow_dispatch:
    inputs:
      only:
        description: "Post this Reel number now (e.g. 001). Leave empty for normal schedule."
        required: false
        default: ""
      dry_run:
        description: "1 = only print, do not post"
        required: false
        default: "0"
      check:
        description: "1 = only test the token, do not post"
        required: false
        default: "0"
      prep:
        description: "1 = upload + process the Reel but do NOT publish (test)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ (github.event.inputs.check == '1' || github.event.inputs.prep == '1' || github.event.inputs.dry_run == '1') && 'post-reel-oneoff' || 'post-reel-v3' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      PAGES_BASE: https://alphazetservices.github.io/hx-reels
      IG_USER_ID: "17841466382176159"
      ONLY: ${{ github.event.inputs.only }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      CHECK: ${{ github.event.inputs.check }}
      PREP_ONLY: ${{ github.event.inputs.prep }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            post_reel.py
            keeper.py
            schedule.json
            posted.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
      - name: One-off run (check / dry run / specific Reel)
        if: ${{ github.event.inputs.only != '' || github.event.inputs.check == '1' || github.event.inputs.prep == '1' || github.event.inputs.dry_run == '1' }}
        run: |
          python post_reel.py
          git add posted.json
          git diff --cached --quiet || (git commit -m "Log posted Reel" && git pull -q --rebase && git push)
      - name: Keep posting on schedule
        if: ${{ github.event.inputs.only == '' && github.event.inputs.check != '1' && github.event.inputs.dry_run != '1' && github.event.inputs.prep != '1' }}
        run: python keeper.py
      - name: Hand over to a fresh run
        if: ${{ always() && github.event.inputs.only == '' && github.event.inputs.check != '1' && github.event.inputs.dry_run != '1' && github.event.inputs.prep != '1' && hashFiles('.done') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run post.yml --ref main
